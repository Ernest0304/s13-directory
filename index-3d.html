<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KitchenBASE · S13 Kitchen Directory — 3D</title>
  <link rel="icon" type="image/png" href="img/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css?v=25" />
  <!-- Three.js r160 is bundled in vendor/three/ (no CDN): map3d.js's dynamic imports resolve here -->
  <script type="importmap">
  { "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  } }
  </script>
  <style>
    /* 3D map fills the map area (behind the floating rail, like the SVG board) */
    .main-a .map { padding: 0; display: block; overflow: hidden; }
    /* crisp CSS2D labels floating on the 3D blocks */
    .m3-lab, .m3-svc, .m3-here { pointer-events: none; white-space: nowrap; text-align: center; transform: translateY(-50%); }
    .m3-badge { width: calc(44px * var(--m3k, 1)); height: calc(44px * var(--m3k, 1)); border-radius: 50%; background: #fff; margin: 0 auto 3px; display: grid; place-items: center; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
    .m3-badge img { width: 82%; height: 82%; object-fit: contain; }
    .m3-badge .ic { font-size: calc(23px * var(--m3k, 1)); }
    .m3-nm { color: #fff; font-weight: 800; font-size: calc(15px * var(--m3k, 1)); line-height: 1.05; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
    .m3-code { color: #fff; font-weight: 700; font-size: calc(12px * var(--m3k, 1)); opacity: .86; letter-spacing: .05em; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    /* a name stays inside its own block: map3d.js sets max-width + data-fit from the block's on-screen width */
    .m3-lab { white-space: normal; }
    /* occupied blocks: the badge floats above the roof centre and the name hangs below it, so the
       text always sits on the block's own colour (roof, then front wall) instead of the white floor behind */
    .m3-lab:not(.vac) { transform: translateY(calc(50% - 47px * var(--m3k, 1))); }
    .m3-lab .m3-code, .m3-lab .m3-av { white-space: nowrap; }
    .m3-nm { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: break-word; text-wrap: balance; padding-bottom: 1px; }
    .m3-lab[data-fit="m"] .m3-nm { font-size: calc(13px * var(--m3k, 1)); }
    .m3-lab[data-fit="s"] .m3-nm { font-size: calc(12px * var(--m3k, 1)); }
    .m3-lab[data-fit="x"] .m3-nm { display: none; }
    /* bright roofs (amber, beige) and blocks faded behind a selection: dark text, light halo */
    .m3-lab.on-light .m3-nm, .m3-lab.on-light .m3-code { color: #1b2433; text-shadow: 0 1px 5px rgba(255,255,255,.85), 0 0 2px rgba(255,255,255,.6); }
    .m3-lab.on-light .m3-code { opacity: .78; }
    .m3-lab.vac { opacity: .92; }
    .m3-code.big { font-size: calc(17px * var(--m3k, 1)); opacity: .92; }
    .m3-av { color: #fff; font-size: calc(11px * var(--m3k, 1)); opacity: .78; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .m3-svc { color: #eaf0f7; font-size: calc(12px * var(--m3k, 1)); font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.55); }
    .m3-svc.out { color: #f4ead9; font-style: italic; }
    /* day palette: vacant + service blocks are near-white — labels go ink, not white */
    [data-theme="bright"] .m3-svc { color: #7c8697; text-shadow: none; }
    [data-theme="bright"] .m3-svc.out { color: #a89a80; }
    [data-theme="bright"] .m3-lab.vac .m3-code, [data-theme="bright"] .m3-lab.vac .m3-av { color: #5b6678; text-shadow: none; }
    [data-theme="bright"] .m3-lab.vac.sel .m3-code, [data-theme="bright"] .m3-lab.vac.sel .m3-av { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
    .m3-here { color: #fff; background: #16181d; border-radius: 999px; padding: .38em .8em; font-weight: 800; font-size: calc(13px * var(--m3k, 1)); letter-spacing: .05em; box-shadow: 0 4px 14px rgba(0,0,0,.28); }
    /* 2D + night mode removed on the final 3D board (containers kept for app.js wiring) */
    #viewToggle, #themeToggle { display: none; }

    /* ---- collapsible directory rail (users reported it covering K-11/K-12) ---- */
    .main-a .browse-float { transition: transform .42s cubic-bezier(.22,.61,.36,1), opacity .3s ease; }
    .kiosk.rail-hidden .browse-float { transform: translateX(calc(100% + clamp(14px,1.6vw,30px))); opacity: 0; pointer-events: none; }
    .kiosk.rail-hidden .main-a .map { padding-right: clamp(8px,1.4vh,20px); }   /* map reclaims the full width */
    .kiosk.rail-hidden .facility-foot { max-width: calc(100% - clamp(30px,4vw,70px)); }

    /* Edge grab-handle on the rail's left lip. Reads narrow, but the touch target is
       padded out to ~64px — kiosk users tap with a finger, not a mouse. */
    .rail-toggle { position: absolute; z-index: 30; top: 50%; transform: translateY(-50%);
      right: calc(clamp(278px,28vw,440px) + clamp(14px,1.6vw,30px) - 1px);
      display: grid; place-items: center; cursor: pointer; font: inherit; color: var(--muted);
      width: clamp(30px,2.4vw,38px); height: clamp(84px,11vh,124px); padding: 0;
      background: var(--float); border: 1px solid var(--float-brd); border-right: none;
      -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
      border-radius: 14px 0 0 14px; box-shadow: -6px 0 20px -8px rgba(28,45,80,.3);
      transition: right .42s cubic-bezier(.22,.61,.36,1), background .18s, color .18s, transform .18s; }
    /* invisible finger zone — the handle reads narrow but is comfortably tappable */
    .rail-toggle::before { content: ""; position: absolute; inset: -16px -26px; }
    .rail-toggle:hover { color: var(--ink); }
    .rail-toggle:active { background: var(--glass-2); color: var(--ink); transform: translateY(-50%) scale(.94); }
    .rail-toggle .rt-ico { display: block; width: clamp(15px,1.25vw,19px); height: auto;
      transition: transform .42s cubic-bezier(.22,.61,.36,1); }
    .rail-toggle .rt-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }  /* label kept for screen readers */
    .kiosk.rail-hidden .rail-toggle { right: 0; border-radius: 14px 0 0 14px; }
    .kiosk.rail-hidden .rail-toggle .rt-ico { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) { .rail-toggle, .rail-toggle .rt-ico, .main-a .browse-float { transition: none; } }
    /* map tools: a touch hint, replaced by a Reset-map button once the visitor has moved the map.
       Their text is set through data-copy, not data-i18n: on the first load after a deploy an older
       service worker can still serve the previous app.js, which stops at any data-i18n key it lacks. */
    .map-tools { position: absolute; z-index: 25; bottom: clamp(66px, 8.5vh, 100px); transform: translateX(-50%);
      left: calc(50% - (clamp(278px,28vw,440px) + clamp(14px,1.6vw,30px)) / 2); transition: left .42s cubic-bezier(.22,.61,.36,1);
      display: grid; place-items: center; pointer-events: none; }
    .kiosk.rail-hidden .map-tools { left: 50%; }
    .map-tools > * { grid-area: 1 / 1; transition: opacity .25s ease, transform .25s ease; }
    .map-hint { color: var(--muted); background: var(--float); border: 1px solid var(--float-brd); border-radius: 999px;
      padding: .5em 1.1em; font-size: clamp(13px, 1.1vw, 17px); font-weight: 600; white-space: nowrap;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    .recentre { pointer-events: auto; font: inherit; font-weight: 800; font-size: clamp(16px, 1.35vw, 21px); cursor: pointer;
      display: inline-flex; align-items: center; gap: .5em; color: #fff; background: #16181d; border: 0; border-radius: 999px;
      min-height: 56px; padding: 0 1.4em; box-shadow: 0 10px 26px -8px rgba(0,0,0,.45); opacity: 0; transform: translateY(8px); visibility: hidden; }
    .recentre:active { transform: scale(.96); }
    .recentre svg { width: 1.15em; height: 1.15em; }
    .kiosk.map-moved .recentre { opacity: 1; transform: none; visibility: visible; }
    .kiosk.map-moved .map-hint, .kiosk.map-sel .map-hint { opacity: 0; transform: translateY(8px); }
    @media (prefers-reduced-motion: reduce) { .map-tools, .map-tools > * { transition: none; } }
  </style>
</head>
<body>
  <div class="kiosk" id="kiosk" data-theme="bright">

    <div class="toggles">
      <div class="seg" id="viewToggle" role="group" aria-label="Map view">
        <button data-view="3d" class="active" aria-label="3D view">3D</button>
        <button data-view="2d" aria-label="2D view">2D</button>
      </div>
      <div class="seg" id="langToggle" role="group" aria-label="Language">
        <button data-lang="en" class="active" aria-label="English">English</button>
        <button data-lang="zh" aria-label="中文">中文</button>
      </div>
      <div class="seg" id="themeToggle" role="group" aria-label="Theme">
        <button data-theme="bright" class="active" aria-label="Day theme">☀</button>
        <button data-theme="dark" aria-label="Night theme">🌙</button>
      </div>
    </div>

    <!-- ATTRACT / IDLE -->
    <section class="screen attract active" id="attract" aria-label="Touch to begin">
      <div class="topbar">
        <div class="wordmark">
          <span class="mark"><img src="img/logo.png?v=3" alt="KitchenBASE" /></span>
          <span class="wm-text"><b data-i18n-brand>KitchenBASE</b><i data-i18n="directory">Kitchen Directory</i><em class="wm-addr">1550 Bedok North Ave 4, #04-21<br/>Singapore 489950</em></span>
        </div>
      </div>
      <div class="slides" id="slides"></div>
      <div class="attract-foot">
        <div class="cta" data-i18n="touchToBegin">TOUCH TO BEGIN</div>
        <div class="cta-sub" data-i18n="tapAnywhere">Tap anywhere to start</div>
      </div>
    </section>

    <!-- MAIN: 3D map + floating panels (Option A shell, unchanged) -->
    <section class="screen main main-a" id="main" aria-label="Directory">
      <div class="map" id="map"><!-- Three.js canvas injected --></div>

      <header class="main-head brand-float">
        <div class="wordmark sm">
          <span class="mark"><img src="img/logo.png?v=3" alt="KitchenBASE" /></span>
          <span class="wm-text"><b data-i18n-brand>KitchenBASE</b><i data-i18n="directory">Kitchen Directory</i><em class="wm-addr">1550 Bedok North Ave 4, #04-21<br/>Singapore 489950</em></span>
        </div>
        <button class="home-btn" id="homeBtn">⟲ <span data-i18n="startOver">Start Over</span></button>
      </header>

      <aside class="browse-float" id="browseRail">
        <div class="filters" id="filters"></div>
        <div class="info-panel" id="infoPanel"></div>
        <div class="shoprow" id="shoprow"></div>
        <button class="list-more" id="listMore" type="button"></button>
      </aside>
      <button class="rail-toggle" id="railToggle" aria-controls="browseRail" aria-expanded="true"
              title="Hide the directory to see the whole map">
        <svg class="rt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        <span class="rt-txt" data-i18n-rail>Hide list</span>
      </button>

      <div class="map-tools" id="mapTools">
        <span class="map-hint" data-copy="mapHint">Tap a kitchen to see the way · drag to turn the map</span>
        <button class="recentre" id="recentreBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span data-copy="recentre">Reset map</span>
        </button>
      </div>

      <footer class="facility-foot" id="facilityFoot"></footer>
      <div class="idle-warn" id="idleWarn" role="status" aria-live="polite"></div>
    </section>

  </div>

  <script src="js/config.js?v=2"></script>
  <script src="js/data.js?v=23"></script>
  <script src="js/db.js?v=4"></script>
  <script>
    // 2D view + night mode are removed on this board: pin day theme + 3D view,
    // overriding any admin defaults (wrapped before app.js consumes loadContent)
    const __loadContent = loadContent;
    loadContent = async function () {
      const r = await __loadContent();
      if (SETTINGS) { SETTINGS.defaultTheme = "bright"; SETTINGS.defaultView = "3d"; }
      return r;
    };
  </script>
  <script src="js/map3d.js?v=18"></script>
  <script src="js/app.js?v=16"></script>
  <script>
    // Collapsible directory rail — visitors reported it covering the right-hand
    // kitchens (K-11/K-12). Hiding it hands the full width back to the map and
    // tells map3d to re-frame (it normally offsets right to clear the rail).
    (function () {
      var kiosk = document.getElementById("kiosk"), btn = document.getElementById("railToggle");
      var TXT = { en: { hide: "Hide list", show: "Show list" }, zh: { hide: "隐藏列表", show: "显示列表" } };
      function label() {
        var lang = document.documentElement.lang === "zh" ? "zh" : "en";
        var hidden = kiosk.classList.contains("rail-hidden");
        var t = TXT[lang][hidden ? "show" : "hide"];
        btn.querySelector(".rt-txt").textContent = t;   // visually hidden — for screen readers
        btn.setAttribute("title", t);
        btn.setAttribute("aria-label", t);
        btn.setAttribute("aria-expanded", hidden ? "false" : "true");
      }
      function setRail(hidden) {
        kiosk.classList.toggle("rail-hidden", hidden);
        label();
        // MapKiosk is a top-level `const` (not on window) — reference it directly
        if (typeof MapKiosk !== "undefined" && MapKiosk.setRailHidden) MapKiosk.setRailHidden(hidden);
      }
      btn.addEventListener("click", function (e) { e.stopPropagation(); setRail(!kiosk.classList.contains("rail-hidden")); });
      // keep the label in sync with the EN/中 toggle, and always start a new visitor with the list showing
      document.getElementById("langToggle").addEventListener("click", function () { setTimeout(label, 60); });
      document.addEventListener("kiosk:lang", label);                       // language reset between visitors
      document.addEventListener("kiosk:select", function () { if (kiosk.classList.contains("rail-hidden")) setRail(false); });  // the answer lives in the list
      document.getElementById("attract").addEventListener("click", function () { setRail(false); });
      document.getElementById("homeBtn").addEventListener("click", function () { setRail(false); });
      document.getElementById("recentreBtn").addEventListener("click", function (e) { e.stopPropagation(); if (typeof MapKiosk !== "undefined" && MapKiosk.refocus) MapKiosk.refocus(); });
      label();
    })();
  </script>
  <script>
    // Offline shell (sw.js): after one online load this page, its scripts and the 3D engine
    // open with no network, so a 04:00 restart during an outage still brings the board up.
    // A new deploy is picked up with one reload, only while the ad screen is showing; if a
    // visitor is mid-route, app.js reloads the moment the board returns to the ads.
    if ("serviceWorker" in navigator) {
      var swHadController = !!navigator.serviceWorker.controller, swReloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (swReloaded || !swHadController) return;
        var att = document.getElementById("attract");
        if (att && att.classList.contains("active")) { swReloaded = true; location.reload(); }
        else { window.__swPendingReload = true; }
      });
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("[sw] registration failed:", e && e.message); });
      });
    }
  </script>
</body>
</html>
